name: AnyDesk Remote Desktop

on:
  workflow_dispatch:

jobs:
  secure-anydesk:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Install AnyDesk
        run: |
          $anydeskUrl = "https://download.anydesk.com/AnyDesk.exe"
          $installerPath = "$env:TEMP\AnyDesk.exe"
          
          # Download official AnyDesk executable
          Invoke-WebRequest -Uri $anydeskUrl -OutFile $installerPath
          
          # Run silent installation
          Start-Process -FilePath $installerPath -ArgumentList "--install", "C:\Program Files (x86)\AnyDesk", "--start-with-win", "--silent" -Wait
          
          # Wait up to 30 seconds for AnyDesk executable to register in system
          $timeout = 30
          while (-not (Test-Path "C:\Program Files (x86)\AnyDesk\AnyDesk.exe") -and -not (Test-Path "C:\Program Files (x86)\AnyDesk.exe") -and $timeout -gt 0) {
              Start-Sleep -Seconds 1
              $timeout--
          }

      - name: Configure AnyDesk Unattended Access
        run: |
          # Detect actual AnyDesk installation path
          $anydeskPath = $null
          if (Test-Path "C:\Program Files (x86)\AnyDesk\AnyDesk.exe") {
              $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          } elseif (Test-Path "C:\Program Files (x86)\AnyDesk.exe") {
              $anydeskPath = "C:\Program Files (x86)\AnyDesk.exe"
          } else {
              Write-Error "AnyDesk executable not found."
              exit 1
          }

          # Generate a secure 16-character random password
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })

          # Set the unattended access password via AnyDesk CLI
          echo $password | & $anydeskPath --set-password

          # Retrieve the unique AnyDesk Address / ID
          $anydeskId = (& $anydeskPath --get-id).Trim()

          if (-not $anydeskId) {
              Start-Sleep -Seconds 5
              $anydeskId = (& $anydeskPath --get-id).Trim()
          }

          echo "ANYDESK_ID=$anydeskId" >> $env:GITHUB_ENV
          echo "ANYDESK_PASS=$password" >> $env:GITHUB_ENV

      - name: Maintain Connection & Output Credentials
        run: |
          Write-Host "`n=========================================="
          Write-Host "=== ANYDESK ACCESS CREDENTIALS ==="
          Write-Host "AnyDesk Address ID : $env:ANYDESK_ID"
          Write-Host "Password           : $env:ANYDESK_PASS"
          Write-Host "==========================================`n"

          # Keep runner active until workflow timeout or manual cancellation
          while ($true) {
              Write-Host "[$(Get-Date)] AnyDesk Session Active - Disconnect or cancel workflow to terminate"
              Start-Sleep -Seconds 300
          }

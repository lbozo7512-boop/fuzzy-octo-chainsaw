name: AnyDesk Remote Desktop

on:
  workflow_dispatch:

jobs:
  secure-anydesk:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Install AnyDesk via Choco
        run: |
          # Install AnyDesk service cleanly using Chocolatey
          choco install anydesk.install -y --no-progress

          # Ensure AnyDesk background service is running
          Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue

      - name: Configure AnyDesk Unattended Access
        run: |
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          # Generate a secure 16-character random password
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })

          # Set unattended access password
          echo $password | & $anydeskPath --set-password

          # Poll for AnyDesk ID until service initializes
          $anydeskId = $null
          $retries = 0
          while ((-not $anydeskId) -and ($retries -lt 12)) {
              Start-Sleep -Seconds 5
              $rawId = & $anydeskPath --get-id
              if ($rawId) {
                  $anydeskId = $rawId.ToString().Trim()
              }
              $retries++
          }

          if (-not $anydeskId) {
              Write-Error "Failed to generate AnyDesk ID."
              exit 1
          }

          echo "ANYDESK_ID=$anydeskId" >> $env:GITHUB_ENV
          echo "ANYDESK_PASS=$password" >> $env:GITHUB_ENV

      - name: Maintain Connection & Output Credentials
        run: |
          Write-Host "`n=========================================="
          Write-Host "=== ANYDESK ACCESS CREDENTIALS ==="
          Write-Host "AnyDesk Address ID : $env:ANYDESK_ID"
          Write-Host "Password           : $env:ANYDESK_PASS"
          Write-Host "==========================================`n"

          # Keep runner active until workflow timeout or manual cancellation
          while ($true) {
              Write-Host "[$(Get-Date)] AnyDesk Session Active - Disconnect or cancel workflow to terminate"
              Start-Sleep -Seconds 300
          }
